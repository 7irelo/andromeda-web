# RabbitMQ drop-in for Andromeda (mounted into /etc/rabbitmq/conf.d/).
#
# The video worker runs one transcode at a time (up to 90 minutes, see
# watch.tasks.process_video) while holding the next message prefetched and
# unacknowledged. RabbitMQ's default 30-minute delivery acknowledgement
# timeout would close the worker's channel mid-transcode and redeliver, so it
# is raised to 3 hours. rabbitmq.conf can only set this broker-wide; other
# queues' tasks finish in seconds, so the longer limit only matters for video.
consumer_timeout = 10800000
