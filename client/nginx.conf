server_tokens off;

# Content Security Policy for the Angular app (Material needs inline styles).
# hls.js plays through Media Source Extensions (blob: media URLs) and
# transmuxes in a worker it creates from a blob: URL.
map $sent_http_content_type $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

# Behind the production TLS proxy (Caddy) the original scheme arrives in
# X-Forwarded-Proto; only "https" is passed on, anything else means our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# Every request gets an id (nginx's $request_id, 32 hex chars, never the
# client's). It's logged here, sent to Django as X-Request-ID and returned to
# the client by Django, so one id follows a request through every log.
log_format andromeda '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" rt=$request_time rid=$request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 510m;  # largest upload is a 500 MB video (validated again by Django)

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microphone for chat voice notes, same origin only (recordings play from blob: URLs, see media-src).
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    access_log /var/log/nginx/access.log andromeda;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Angular routes – return index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API. Only /api/ and /ws/ reach Django; /metrics and /admin stay internal.
    # ^~ so the static-asset regex below never captures API paths such as a
    # private video's thumb.jpg.
    location ^~ /api/ {
        proxy_pass         http://django:8000;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_read_timeout 90;
        proxy_request_buffering off;
    }

    # WebSockets. Authenticated with single-use tickets, so query strings
    # carry nothing sensitive; still keep them out of the access log.
    location /ws/ {
        access_log         off;
        proxy_pass         http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_read_timeout 86400;
    }

    # Public media only. Private objects (chat attachments) are streamed by
    # Django after an authorization check and are never served from here.
    location ^~ /media/public/ {
        proxy_pass         http://minio:9000/andromeda-media/public/;
        proxy_set_header   Host minio:9000;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        proxy_hide_header  Set-Cookie;
        add_header         Cache-Control "public, max-age=3600";
        add_header         X-Content-Type-Options "nosniff" always;
        add_header         Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
        limit_except GET HEAD { deny all; }
    }

    location ^~ /media/ {
        return 404;
    }

    # Direct video uploads: the browser POSTs a presigned policy issued by
    # /api/watch/uploads/ straight to the bucket. POST only and no query
    # string, so nothing but a policy upload gets through; MinIO enforces the
    # policy's exact key (under private/uploads/), content type and size.
    location = /media-upload/ {
        limit_except POST { deny all; }
        if ($args) { return 403; }
        client_max_body_size 510m;
        proxy_pass              http://minio:9000/andromeda-media;
        proxy_set_header        Host minio:9000;
        proxy_request_buffering off;
        proxy_read_timeout      600;
        proxy_hide_header       x-amz-id-2;
        proxy_hide_header       x-amz-request-id;
        proxy_hide_header       Set-Cookie;
    }

    # The service worker and its manifest must never be cached long, or
    # clients get stuck on an old build. A worker's own response CSP applies
    # to the worker, so the headers are repeated here (add_header in a
    # location replaces the server-level ones).
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache static assets (Angular build artefacts only – not /media/)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
