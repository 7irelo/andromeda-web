<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Andromeda</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Andromeda – Connect with the universe around you">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <meta name="theme-color" content="#4f46e5">
  <style>
    /* Boot shell: painted before the app script runs (and if it never does). Same values as the design tokens. */
    body { margin: 0; background: #ffffff; }
    .boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 12px;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; color: #000000; }
    .boot-mark { fill: currentColor; }
    .boot-name { font-size: 16px; font-weight: 700; letter-spacing: .08em; }
    @media (prefers-color-scheme: dark) { body { background: #000000; } .boot { color: #ffffff; } }
  </style>
</head>
<body class="mat-typography">
  <app-root>
    <div class="boot" aria-hidden="true">
      <svg class="boot-mark" viewBox="0 0 32 28" width="30" height="26"><path d="M16 0 32 28H24.5L16 12.6 9.6 24 20 24 22.2 28H0L16 0Z"/></svg>
      <div class="boot-name">ANDROMEDA</div>
    </div>
  </app-root>
  <noscript>Andromeda needs JavaScript. Please enable it to continue.</noscript>
</body>
</html>
