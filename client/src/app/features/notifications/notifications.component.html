<div class="notifications-page">
  <div class="page-header-gradient notif-header">
    <div>
      <h1>Notifications</h1>
      <p style="opacity:.85;margin-top:4px;font-size:14px">Stay up to date with your activity</p>
    </div>
    <button mat-flat-button (click)="markAllRead()" *ngIf="notifications.length > 0" class="mark-all">
      <mat-icon aria-hidden="true">done_all</mat-icon> Mark all read
    </button>
  </div>

  <app-skeleton *ngIf="loading" variant="list" [count]="6" class="notif-list"></app-skeleton>

  <app-error-state *ngIf="!loading && loadError" (retry)="load()"></app-error-state>

  <ng-container *ngIf="!loading && !loadError">
    <!-- Window-scrolled virtual list: only the rows on screen are in the DOM. -->
    <cdk-virtual-scroll-viewport
      *ngIf="notifications.length > 0"
      scrollWindow
      [itemSize]="rowHeight"
      class="notif-list"
      role="list"
      aria-label="Notifications"
    >
      <div *cdkVirtualFor="let n of notifications; trackBy: trackById" role="listitem" class="notif-row">
        <button type="button" class="notif-item" [class.unread]="!n.is_read" (click)="markRead(n)">
          <span class="notif-avatar-wrap">
            <img
              [src]="n.sender?.avatar_url || 'assets/default-avatar.png'"
              class="avatar md"
              alt=""
              width="40"
              height="40"
              loading="lazy"
            />
            <span class="notif-type-icon" aria-hidden="true">
              <mat-icon>{{ getIcon(n.notification_type, n.extra) }}</mat-icon>
            </span>
          </span>

          <span class="notif-content">
            <span class="notif-title">{{ n.title }}</span>
            <span class="notif-body" *ngIf="n.body">{{ n.body }}</span>
            <span class="notif-time">{{ timeAgo(n.created_at) }}</span>
          </span>

          <span class="unread-dot" *ngIf="!n.is_read"></span>
          <span class="visually-hidden" *ngIf="!n.is_read">(unread)</span>
        </button>
      </div>
    </cdk-virtual-scroll-viewport>

    <app-empty-state *ngIf="notifications.length === 0" icon="notifications_none"
                     title="All caught up!" message="You'll be notified when something happens"></app-empty-state>
  </ng-container>
</div>
