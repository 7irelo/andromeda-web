<div class="ui-page">
  <h1 class="visually-hidden">Marketplace</h1>

  <div class="toolbar">
    <div class="search">
      <button class="ui-icon-btn" type="button" (click)="load()" aria-label="Search"><mat-icon aria-hidden="true">search</mat-icon></button>
      <input type="search" [(ngModel)]="searchQuery" (keyup.enter)="load()" maxlength="100"
             placeholder="Search items..." aria-label="Search Marketplace" />
    </div>
    <a class="ui-btn" routerLink="/marketplace/saved"><mat-icon aria-hidden="true">favorite_border</mat-icon> Saved</a>
    <a class="ui-btn" routerLink="/marketplace/mine"><mat-icon aria-hidden="true">inventory_2</mat-icon> My listings</a>
    <button class="ui-btn ui-btn-primary" type="button" (click)="openCreateDialog()">
      <mat-icon aria-hidden="true">add</mat-icon> <span i18n="@@marketplace.listItem">List Item</span>
    </button>
  </div>

  <div class="filter-row">
    <div class="ui-chips chips" role="group" aria-label="Category" i18n-aria-label="@@marketplace.categoryFilter">
      <button class="ui-chip" type="button" [attr.aria-pressed]="!category" (click)="selectCategory('')"
              i18n="@@marketplace.categoryAll">All</button>
      <button class="ui-chip" type="button" *ngFor="let top of categories"
              [attr.aria-pressed]="isCategoryActive(top)" (click)="selectCategory(top.slug)">{{ top.name }}</button>
    </div>
    <div class="sort-group">
      <select class="ui-control" aria-label="Sort" [ngModel]="sort" (ngModelChange)="sort = $event; load()">
        <option value="">{{ searchQuery ? 'Best match' : 'Newest' }}</option>
        <option value="newest" *ngIf="searchQuery">Newest</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="nearest" [disabled]="!hasLocation">Nearest{{ hasLocation ? '' : ' (set a location)' }}</option>
      </select>
      <button class="ui-btn" type="button" [attr.aria-expanded]="showFilters" (click)="showFilters = !showFilters">
        <mat-icon aria-hidden="true">tune</mat-icon> Filters<span *ngIf="activeFilterCount"> ({{ activeFilterCount }})</span>
      </button>
    </div>
  </div>

  <div class="filters card" *ngIf="showFilters">
    <label class="ui-field">
      Category
      <select class="ui-control" [ngModel]="category" (ngModelChange)="category = $event; load()">
        <option value="">All categories</option>
        <optgroup *ngFor="let top of categories" [label]="top.name">
          <option [value]="top.slug">All {{ top.name }}</option>
          <option *ngFor="let child of top.children" [value]="child.slug">{{ child.name }}</option>
        </optgroup>
      </select>
    </label>

    <div class="price-range">
      <label class="ui-field">
        Min price
        <input class="ui-control" type="number" min="0" [(ngModel)]="minPrice" (change)="load()" />
      </label>
      <label class="ui-field">
        Max price
        <input class="ui-control" type="number" min="0" [(ngModel)]="maxPrice" (change)="load()" />
      </label>
    </div>

    <label class="ui-field">
      Near
      <select class="ui-control" [ngModel]="myPoint ? '__me' : city"
              (ngModelChange)="$event === '__me' ? useMyLocation() : pickCity($event)">
        <option value="">Anywhere</option>
        <option value="__me" [disabled]="locating">My location</option>
        <option *ngFor="let c of cities" [value]="c.name">{{ c.name }}</option>
      </select>
    </label>

    <label class="ui-field" *ngIf="hasLocation">
      Within
      <select class="ui-control" [ngModel]="radiusKm" (ngModelChange)="radiusKm = $event; load()">
        <option [ngValue]="null">Any distance</option>
        <option *ngFor="let r of radii" [ngValue]="r">{{ r }} km</option>
      </select>
    </label>

    <div class="filter-actions">
      <mat-spinner *ngIf="locating" diameter="20"></mat-spinner>
      <button class="ui-btn ui-btn-ghost" type="button" (click)="clearFilters()" [disabled]="!activeFilterCount">Clear filters</button>
    </div>

    <fieldset>
      <legend>Condition</legend>
      <label class="ui-check" *ngFor="let c of conditions">
        <input type="checkbox" [checked]="conditionFilter.includes(c.value)" (change)="toggleCondition(c.value)" />
        {{ c.label }}
      </label>
    </fieldset>
  </div>

  <app-skeleton *ngIf="loading" variant="grid" [count]="6"></app-skeleton>
  <app-error-state *ngIf="!loading && loadError" [message]="loadError" (retry)="load()"></app-error-state>

  <div class="ui-grid" *ngIf="!loading && !loadError">
    <app-listing-card *ngFor="let listing of listings" [listing]="listing"></app-listing-card>
  </div>

  <div class="ui-more" *ngIf="!loading && nextPage">
    <button class="ui-btn" type="button" (click)="loadMore()" [disabled]="loadingMore">
      {{ loadingMore ? 'Loading…' : 'Load more' }}
    </button>
  </div>

  <app-empty-state *ngIf="!loading && !loadError && listings.length === 0" icon="storefront" title="No listings found"
                   [message]="activeFilterCount || searchQuery ? 'Try a different search or clear some filters.' : 'Be the first to sell something nearby.'">
    <button class="ui-btn" type="button" *ngIf="activeFilterCount" (click)="clearFilters()">Clear filters</button>
    <button class="ui-btn ui-btn-primary" type="button" (click)="openCreateDialog()" i18n="@@marketplace.listItem">List Item</button>
  </app-empty-state>
</div>

<app-listing-form
  *ngIf="isCreating"
  [categories]="categories"
  [cities]="cities"
  (saved)="onCreated($event)"
  (closed)="isCreating = false"
></app-listing-form>
