<div class="page ui-controls">
  <div class="page-head">
    <div>
      <h1>Groups</h1>
      <p>Connect with communities that matter to you</p>
    </div>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon aria-hidden="true">add</mat-icon> Create Group
    </button>
  </div>

  <mat-tab-group class="ui-tabs" mat-stretch-tabs="false" animationDuration="0ms">
    <mat-tab label="Discover">
      <app-skeleton *ngIf="loading" variant="grid" [count]="6" class="tab-state"></app-skeleton>
      <app-error-state *ngIf="!loading && loadError" (retry)="loadAll()"></app-error-state>
      <app-empty-state *ngIf="!loading && !loadError && allGroups.length === 0" icon="groups"
                       title="No groups to discover yet" message="Start one and invite your friends.">
        <button mat-flat-button color="primary" type="button" (click)="openCreateDialog()">Create Group</button>
      </app-empty-state>
      <div class="card-grid" *ngIf="!loading && !loadError">
        <div class="item-card card" *ngFor="let g of allGroups">
          <div class="item-cover">
            <img *ngIf="g.cover_photo" [src]="g.cover_photo" alt="" />
          </div>
          <div class="item-body">
            <div class="item-name">{{ g.name }}</div>
            <div class="item-meta">{{ g.members_count | number }} members · {{ g.privacy }}</div>
            <div class="item-action">
              <!-- Joining happens on the group page, where the rules are shown first. -->
              <a mat-stroked-button [routerLink]="'/groups/' + g.id">{{ g.is_member ? 'View Group' : 'View & Join' }}</a>
            </div>
          </div>
        </div>
      </div>
    </mat-tab>

    <mat-tab label="Your Groups">
      <app-skeleton *ngIf="mineLoading" variant="grid" [count]="3" class="tab-state"></app-skeleton>
      <app-error-state *ngIf="!mineLoading && mineError" (retry)="loadMine()"></app-error-state>
      <app-empty-state *ngIf="!mineLoading && !mineError && myGroups.length === 0" icon="group"
                       title="You haven't joined any groups" message="Groups you join or create show up here."></app-empty-state>
      <div class="card-grid" *ngIf="!mineLoading && !mineError">
        <div class="item-card card" *ngFor="let g of myGroups">
          <div class="item-cover">
            <img *ngIf="g.cover_photo" [src]="g.cover_photo" alt="" />
          </div>
          <div class="item-body">
            <div class="item-name">{{ g.name }}</div>
            <div class="item-meta">{{ g.members_count | number }} members</div>
            <div class="item-action">
              <a mat-stroked-button [routerLink]="'/groups/' + g.id">View Group</a>
            </div>
          </div>
        </div>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>

<!-- ── Create Group Dialog ─────────────────────────────────────── -->
<div class="edit-overlay" *ngIf="isCreating" (click)="cancelCreate()"></div>
<div class="edit-dialog card ui-controls" *ngIf="isCreating" [formGroup]="createForm"
     appModalDialog dialogLabel="Create Group" (dismiss)="cancelCreate()">
  <div class="edit-dialog-header">
    <h2>Create Group</h2>
    <button mat-icon-button (click)="cancelCreate()" aria-label="Close"><mat-icon>close</mat-icon></button>
  </div>

  <div class="edit-dialog-body">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Group Name</mat-label>
      <input matInput formControlName="name" placeholder="Name your group" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="What is this group about?"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Privacy</mat-label>
      <mat-select formControlName="privacy">
        <mat-option *ngFor="let p of privacyOptions" [value]="p.value">{{ p.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="edit-dialog-actions">
    <button mat-stroked-button (click)="cancelCreate()" [disabled]="saving">Cancel</button>
    <button mat-flat-button color="primary" (click)="saveCreate()" [disabled]="saving || createForm.invalid">
      <mat-icon *ngIf="!saving">group_add</mat-icon>
      <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
      {{ saving ? 'Creating...' : 'Create Group' }}
    </button>
  </div>
</div>
