<div class="ui-page">
  <h1 class="visually-hidden">Watch</h1>

  <div class="toolbar">
    <div class="ui-chips" role="group" aria-label="Which videos">
      <button class="ui-chip" type="button" [attr.aria-pressed]="feed === 'all'" (click)="setFeed('all')">All videos</button>
      <button class="ui-chip" type="button" [attr.aria-pressed]="feed === 'subscriptions'" (click)="setFeed('subscriptions')">Subscriptions</button>
    </div>
    <div class="toolbar-actions">
      <a class="ui-btn" routerLink="/watch/history"><mat-icon aria-hidden="true">history</mat-icon> History</a>
      <button class="ui-btn ui-btn-primary" type="button" [attr.aria-expanded]="showUpload" (click)="showUpload = !showUpload">
        <mat-icon aria-hidden="true">{{ uploading ? 'hourglass_top' : 'add' }}</mat-icon> Upload Video
      </button>
    </div>
  </div>

  <div class="upload-card card" *ngIf="showUpload">
    <div class="upload-fields">
      <input class="ui-control" type="text" placeholder="Title (optional)" aria-label="Video title (optional)"
             [(ngModel)]="uploadTitle" maxlength="255" />
      <textarea class="ui-control" rows="2" placeholder="Description (optional)" aria-label="Video description (optional)"
                [(ngModel)]="uploadDescription"></textarea>
      <label class="ui-check">
        <input type="checkbox" [(ngModel)]="uploadPublic" />
        Public (anyone can watch it)
      </label>
      <div class="upload-actions">
        <button class="ui-btn file-btn" type="button" (click)="videoInput.click()" [disabled]="uploading">
          <mat-icon aria-hidden="true">upload_file</mat-icon>
          <span class="file-name">{{ selectedVideo ? selectedVideo.name : 'Choose video' }}</span>
        </button>
        <button class="ui-btn ui-btn-primary" type="button" (click)="uploadVideo()" [disabled]="!selectedVideo || uploading">
          <mat-icon aria-hidden="true">cloud_upload</mat-icon>
          {{ uploading ? 'Uploading...' : 'Upload' }}
        </button>
      </div>
      <div class="text-secondary text-xs">MP4, MOV or WebM, up to 500 MB and 20 minutes.</div>
    </div>
    <input #videoInput type="file" hidden accept="video/mp4,video/quicktime,video/webm" (change)="onVideoSelected($event)" />
  </div>

  <app-skeleton *ngIf="loading" variant="grid" [count]="6"></app-skeleton>
  <app-error-state *ngIf="!loading && loadError" (retry)="loadVideos()"></app-error-state>

  <div class="ui-grid ui-grid-single" *ngIf="!loading && !loadError">
    <app-video-card *ngFor="let v of videos" [video]="v"></app-video-card>
  </div>

  <app-empty-state *ngIf="!loading && !loadError && videos.length === 0" icon="play_circle_outline"
                   [title]="feed === 'subscriptions' ? 'No videos from channels you subscribe to yet' : 'No videos yet'"
                   [message]="feed === 'subscriptions' ? 'Subscribe to a channel from any of its videos.' : 'Upload the first one above.'"></app-empty-state>
</div>
