<div class="feed-layout">
  <!-- Main Feed -->
  <section class="feed-main" aria-label="Feed" i18n-aria-label="@@nav.feed">
    <!-- Create Post -->
    <app-create-post (postCreated)="onPostCreated($event)" [currentUser]="currentUser"></app-create-post>

    <!-- Ordering -->
    <div class="feed-toolbar" role="group" aria-label="Sort feed" i18n-aria-label="@@feed.sort">
      <button type="button" class="sort-btn" [class.active]="sort === 'top'" [attr.aria-pressed]="sort === 'top'"
              (click)="setSort('top')">
        <mat-icon aria-hidden="true">auto_awesome</mat-icon> <span i18n="@@feed.sortTop">Top</span>
      </button>
      <button type="button" class="sort-btn" [class.active]="sort === 'latest'" [attr.aria-pressed]="sort === 'latest'"
              (click)="setSort('latest')">
        <mat-icon aria-hidden="true">schedule</mat-icon> <span i18n="@@feed.sortLatest">Latest</span>
      </button>
    </div>

    <!-- New posts from friends, announced over the notifications socket -->
    <button type="button" class="new-posts-btn" *ngIf="newPostIds.size > 0" (click)="showNewPosts()" aria-live="polite">
      <mat-icon aria-hidden="true">arrow_upward</mat-icon>
      <span i18n="@@feed.newPosts">{newPostIds.size, plural, =1 {1 new post} other {{{ newPostIds.size }} new posts}}</span>
    </button>

    <!-- Posts -->
    <app-skeleton *ngIf="loading && posts.length === 0" variant="post" [count]="3"></app-skeleton>

    <app-post-card
      *ngFor="let post of posts; trackBy: trackById"
      [post]="post"
      [allowHide]="true"
      [attr.data-post-id]="post.id"
      (click)="onCardClick(post.id)"
      (postDeleted)="onPostDeleted($event)"
      (postHidden)="onPostHidden($event)"
    ></app-post-card>

    <div *ngIf="loading && posts.length > 0" class="loading-center">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <app-error-state *ngIf="loadError" [compact]="posts.length > 0" (retry)="retry()"></app-error-state>

    <div *ngIf="!hasMore && posts.length > 0" class="end-message" i18n="@@feed.caughtUp">
      You're all caught up
    </div>

    <app-empty-state *ngIf="!loading && !loadError && posts.length === 0" icon="dynamic_feed"
                     title="Your feed is empty" i18n-title="@@feed.emptyTitle"
                     message="Follow people or join groups to see posts in your feed" i18n-message="@@feed.emptyMessage">
      <a routerLink="/friends" mat-flat-button color="primary" i18n="@@feed.findFriends">Find Friends</a>
      <a routerLink="/groups" mat-stroked-button i18n="@@feed.findGroups">Browse groups</a>
    </app-empty-state>
  </section>

  <!-- Right rail. No "Trending": the API has no endpoint that returns popular hashtags. -->
  <aside class="right-rail">
    <section class="rail-card" *ngIf="suggestions.length > 0">
      <h2 class="rail-title" i18n="@@feed.whoToFollow">Who to follow</h2>
      <app-user-card
        *ngFor="let user of suggestions"
        [user]="user"
        (actionDone)="loadSuggestions()"
      ></app-user-card>
    </section>
  </aside>
</div>
