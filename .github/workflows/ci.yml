name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg15-trixie@sha256:8d4485d6fd3156d090ac5f37eb2e22eb59d93c91169414d5809414102ee924b9
        env:
          POSTGRES_DB: andromeda
          POSTGRES_USER: andromeda
          POSTGRES_PASSWORD: andromeda_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U andromeda" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (pyflakes + bandit rules)
        run: ruff check .

      - name: Migrations are committed and in sync
        run: python manage.py makemigrations --check --dry-run --settings=andromeda.settings_test

      - name: Migrations apply cleanly on PostgreSQL
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: andromeda_ci
          NEO4J_ENABLED: "False"
        run: python manage.py migrate --noinput --settings=andromeda.settings

      - name: Production settings pass Django's deploy checks
        env:
          DEBUG: "False"
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level ERROR --settings=andromeda.settings

      - name: Tests with coverage
        run: pytest --cov=. --cov-report=term-missing:skip-covered --cov-fail-under=70

      - name: Postgres integration tests (pgvector retrieval and leak tests)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: andromeda_ci
        run: pytest retrieval --migrations --ds=andromeda.settings_pgtest

  ai:
    name: AI service (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit tests (fake providers, no keys, no network)
        run: pytest -q

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python (pip-audit)
        run: pip install pip-audit && pip-audit -r server/requirements.txt -r ai/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: JavaScript (npm audit, production deps)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build -- --configuration=production

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare env file
        run: |
          cp .env.example .env
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" >> .env

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build --parallel

      - name: Scan images for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
