name: Release

# Tag v* -> build and push server, ai and client images to GHCR with build
# provenance and an SBOM. Deploying is a separate, manual, environment-
# protected job (run this workflow by hand with the tag to deploy).
#
# Secrets for the deploy job (repository or "production" environment secrets;
# none are created by this file):
#   DEPLOY_HOST         server host name or IP
#   DEPLOY_USER         SSH user (in the docker group, no sudo needed)
#   DEPLOY_SSH_KEY      private key for that user (ed25519), deploy-only
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>` (pins the host key)
#   DEPLOY_PATH         checkout of this repository on the server, e.g. /srv/andromeda
# The server pulls from GHCR with its own read-only token (docs/OPERATIONS.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.4.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # signed provenance attestations
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: andromeda-server
            context: server
          - image: andromeda-ai
            context: ai
          - image: andromeda-client
            context: client
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            SENTRY_FRONTEND_DSN=${{ vars.SENTRY_FRONTEND_DSN }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy ${{ inputs.tag }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # protect it with required reviewers in the repository settings
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }'

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Release step, then start the new version
        env:
          TAG: ${{ inputs.tag }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$HOST" \
            "set -euo pipefail; cd '$DEPLOY_PATH' && git fetch --tags --quiet && git checkout --quiet '$TAG' &&
             IMAGE_TAG='${TAG#v}' ./scripts/release.sh &&
             IMAGE_TAG='${TAG#v}' docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --wait"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
