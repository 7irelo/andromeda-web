services:
  # ============================================================
  # Databases
  # ============================================================
  postgres:
    # pgvector build of Postgres 15: same major version, so existing volumes keep working.
    image: pgvector/pgvector:0.8.7-pg15-trixie@sha256:8d4485d6fd3156d090ac5f37eb2e22eb59d93c91169414d5809414102ee924b9
    container_name: andromeda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-andromeda}
      POSTGRES_USER: ${POSTGRES_USER:-andromeda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andromeda_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - andromeda_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andromeda}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: andromeda_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-andromeda_secret}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks:
      - andromeda_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: andromeda_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - andromeda_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: andromeda_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-andromeda}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-andromeda_secret}
      RABBITMQ_DEFAULT_VHOST: andromeda
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Longer consumer timeout so the video worker's prefetched message isn't reclaimed mid-transcode.
      - ./deploy/rabbitmq/20-andromeda.conf:/etc/rabbitmq/conf.d/20-andromeda.conf:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - andromeda_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  minio:
    # minio/minio is no longer published on Docker Hub; pgsty builds the same
    # upstream releases. Pinned by tag and digest.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: andromeda_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-andromeda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-andromeda_secret}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - andromeda_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    container_name: andromeda_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-andromeda} $${MINIO_ROOT_PASSWORD:-andromeda_secret};
      mc mb --ignore-existing myminio/andromeda-media;
      mc anonymous set none myminio/andromeda-media;
      mc anonymous set download myminio/andromeda-media/public;
      mc ilm rule ls myminio/andromeda-media 2>/dev/null | grep -q private/uploads/ ||
        mc ilm rule add --prefix private/uploads/ --expire-days 1 myminio/andromeda-media;
      mc mb --ignore-existing myminio/andromeda-backups;
      mc anonymous set none myminio/andromeda-backups;
      exit 0;
      "
    networks:
      - andromeda_network

  # ============================================================
  # Application Services
  # ============================================================
  django:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: andromeda_django
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             uvicorn andromeda.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --ws websockets"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - NEO4J_BOLT_URL=bolt://neo4j:${NEO4J_PASSWORD:-andromeda_secret}@neo4j:7687
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-andromeda}:${RABBITMQ_PASSWORD:-andromeda_secret}@rabbitmq:5672/andromeda
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-andromeda}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-andromeda_secret}
      - MINIO_BUCKET=andromeda-media
      - MINIO_EXTERNAL_URL=${MINIO_EXTERNAL_URL:-http://localhost:4200/media}
      - AI_SERVICE_URL=http://ai:8100
      # Tracing and error reporting stay off while these are empty (docs/OPERATIONS.md).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=andromeda-api
      # Provider keys live only in the ai service.
      - ANTHROPIC_API_KEY=
      - OPENAI_API_KEY=
      - DEEPGRAM_API_KEY=
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - andromeda_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: andromeda_celery_worker
    restart: unless-stopped
    command: celery -A andromeda worker --loglevel=info --concurrency=4 --task-events -Q notifications,messages,emails,default
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai:8100
      # Tracing and error reporting stay off while these are empty (docs/OPERATIONS.md).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=andromeda-worker
      - ANTHROPIC_API_KEY=
      - OPENAI_API_KEY=
      - DEEPGRAM_API_KEY=
      - POSTGRES_HOST=postgres
      - NEO4J_BOLT_URL=bolt://neo4j:${NEO4J_PASSWORD:-andromeda_secret}@neo4j:7687
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-andromeda}:${RABBITMQ_PASSWORD:-andromeda_secret}@rabbitmq:5672/andromeda
      # Caption, visibility-move and clean-up tasks for videos read and write MinIO.
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-andromeda}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-andromeda_secret}
      - MINIO_BUCKET=andromeda-media
      - MINIO_EXTERNAL_URL=${MINIO_EXTERNAL_URL:-http://localhost:4200/media}
    volumes:
      - media_data:/app/media
    networks:
      - andromeda_network
    depends_on:
      - django
    healthcheck:
      test: ["CMD-SHELL", "grep -qa celery /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Video transcoding (ffmpeg). One task at a time so a long upload can't
  # starve the other queues; it reads and writes media through MinIO.
  celery_video:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: andromeda_celery_video
    restart: unless-stopped
    command: celery -A andromeda worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 -O fair --task-events -Q video -n video@%h
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai:8100
      # Tracing and error reporting stay off while these are empty (docs/OPERATIONS.md).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=andromeda-video
      - ANTHROPIC_API_KEY=
      - OPENAI_API_KEY=
      - DEEPGRAM_API_KEY=
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-andromeda}:${RABBITMQ_PASSWORD:-andromeda_secret}@rabbitmq:5672/andromeda
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-andromeda}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-andromeda_secret}
      - MINIO_BUCKET=andromeda-media
      - MINIO_EXTERNAL_URL=${MINIO_EXTERNAL_URL:-http://localhost:4200/media}
    volumes:
      - media_data:/app/media
    networks:
      - andromeda_network
    depends_on:
      - django
    healthcheck:
      test: ["CMD-SHELL", "grep -qa celery /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: andromeda_celery_beat
    restart: unless-stopped
    command: celery -A andromeda beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      # Tracing and error reporting stay off while these are empty (docs/OPERATIONS.md).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=andromeda-beat
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-andromeda}:${RABBITMQ_PASSWORD:-andromeda_secret}@rabbitmq:5672/andromeda
    networks:
      - andromeda_network
    depends_on:
      - django
    healthcheck:
      test: ["CMD-SHELL", "grep -qa celery /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  flower:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: andromeda_flower
    restart: unless-stopped
    command: celery -A andromeda flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD in .env} --broker=amqp://${RABBITMQ_USER:-andromeda}:${RABBITMQ_PASSWORD:-andromeda_secret}@rabbitmq:5672/andromeda
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-andromeda}:${RABBITMQ_PASSWORD:-andromeda_secret}@rabbitmq:5672/andromeda
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - andromeda_network
    depends_on:
      - rabbitmq
      - celery_worker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery metrics for Prometheus, read from broker events (Flower stays
  # password-protected and isn't scraped).
  celery_exporter:
    image: danihodovic/celery-exporter:0.12.2@sha256:91e0b314cb5d62f0b2cd0ccdd059178d2d26f816ae0df2a4eeeb6b3c6feb5937
    container_name: andromeda_celery_exporter
    restart: unless-stopped
    environment:
      - CE_BROKER_URL=amqp://${RABBITMQ_USER:-andromeda}:${RABBITMQ_PASSWORD:-andromeda_secret}@rabbitmq:5672/andromeda
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - andromeda_network
    depends_on:
      - rabbitmq

  # ============================================================
  # AI service (internal only: no published ports)
  # ============================================================
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: andromeda_ai
    restart: unless-stopped
    # Only the variables this service needs; nothing else from .env.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:?Set AI_SERVICE_SECRET in .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
      - DAILY_USER_TOKEN_BUDGET=${AI_DAILY_USER_TOKEN_BUDGET:-200000}
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Tracing and error reporting stay off while these are empty (docs/OPERATIONS.md).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=andromeda-ai
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - andromeda_network
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================
  # Frontend + Reverse Proxy
  # ============================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Browser error reporting; empty = off. Reports go through /api/errors/ (same origin).
        SENTRY_FRONTEND_DSN: ${SENTRY_FRONTEND_DSN:-}
    container_name: andromeda_client
    restart: unless-stopped
    ports:
      - "4200:80"
    volumes:
      - media_data:/app/media:ro
    networks:
      - andromeda_network
    depends_on:
      - django

  # ============================================================
  # Monitoring Exporters
  # ============================================================
  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: andromeda_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - andromeda_network
    depends_on:
      - redis

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: andromeda_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-andromeda}:${POSTGRES_PASSWORD:-andromeda_secret}@postgres:5432/${POSTGRES_DB:-andromeda}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - andromeda_network
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # Prometheus & Grafana
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: andromeda_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - andromeda_network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: andromeda_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_SMTP_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - andromeda_network
    depends_on:
      - prometheus

  # Alert routing. Receivers read secrets from files written here from env
  # vars, so the config in the repo holds none (monitoring/alertmanager/).
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: andromeda_alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /tmp/am &&
        printf '%s' "$${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:9/alerts-not-configured}" > /tmp/am/webhook_url &&
        printf '%s' "$${ALERTMANAGER_SMTP_PASSWORD:-}" > /tmp/am/smtp_password &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager --web.listen-address=:9093 --cluster.listen-address=
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - andromeda_network

  # ============================================================
  # Tracing (opt-in: docker compose --profile observability up -d,
  # then set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318)
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    container_name: andromeda_otel_collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./monitoring/otel/collector.yml:/etc/otelcol/config.yml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks:
      - andromeda_network
    depends_on:
      - jaeger

  jaeger:
    # Jaeger v2: all-in-one by default (collector, in-memory storage, UI).
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    container_name: andromeda_jaeger
    profiles: ["observability"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - andromeda_network

networks:
  andromeda_network:
    driver: bridge
    name: andromeda_network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
  rabbitmq_data:
  minio_data:
  media_data:
  static_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
